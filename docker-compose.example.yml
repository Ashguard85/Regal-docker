services:
  app:
    build:
      context: https://github.com/USER/brettspielregal.git#main
    container_name: brettspielregal
    ports:
      - "8090:8080"
    volumes:
      - /home/USER/docker/brettspielregal/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_TITLE: Brettspielregal
      APP_URL: https://api.example.com
      SECRET_KEY: ${SECRET_KEY}
      PWA_ALLOWED_ORIGIN: https://app.example.com
      BACKUP_KEEP: "50"

      # KI-Analyse der bereits sicher geladenen Produktseite
      AI_IMPORT_ENABLED: "true"
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_TEXT_MODEL: qwen3:14b
      OLLAMA_VISION_MODEL: gemma3:12b
      # OLLAMA_MODEL bleibt als Legacy-Alias unterstützt
      OLLAMA_TIMEOUT_SECONDS: "600"
      AI_MAX_PAGE_CHARS: "16000"

      # Standard: keine externe Cloud-Websuche
      RULE_SEARCH_PROVIDER: none
      WEB_FALLBACK_PROVIDER: none

      # Nur nötig, wenn AI_PROVIDER=openai oder einer der Search-Provider=openai ist
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-5.6-luna
    restart: unless-stopped
